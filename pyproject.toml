[tool.black]
line-length = 100

[tool.nbqa.mutate]
isort = 1
black = 1
pyupgrade = 1

[tool.pixi.workspace]
authors = ["Chris Fonnesbeck <fonnesbeck@gmail.com>"]
channels = ["conda-forge"]
description = "Add a short description here"
name = "pymc-examples"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tool.pixi.dependencies]
python = ">=3.13.9,<3.14"
pymc = ">=6.0,<7"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.1.0,<8"
ipywidgets = ">=8.1.8,<9"
numpy = ">=2.3.5,<3"
arviz = ">=1.0,<2"
numpyro = ">=0.19.0,<0.20"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.10.8,<4"
pandas = ">=2.3.3,<3"
polars = ">=1.35.2,<2"
esbonio = ">=1.0.0,<2"
watermark = ">=2.5.0,<3"
nutpie = ">=0.16.3,<0.17"
numba = ">=0.62.1,<0.63"
scikit-learn = ">=1.7.2,<2"
blackjax = ">=1.3,<2"
networkx = ">=3.6,<4"
bokeh = ">=3.8.1,<4"
plotly = ">=6.5.0,<7"
pre-commit = ">=4.6.2,<5"

[tool.pixi.pypi-dependencies]
pymc-extras = ">=0.5.0, <0.6"
kaleido = ">=1.2.0, <2"

# Mirrors requirements-docs.txt, which Read the Docs installs from.
[tool.pixi.feature.docs.pypi-dependencies]
ablog = ">=0.11"
matplotlib = "*"
myst-nb = "*"
sphinx-codeautolink = "*"
sphinx = ">=5"
pymc-sphinx-theme = ">=0.16"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx-notfound-page = "*"
sphinxcontrib-bibtex = "*"
sphinxext-opengraph = "*"
sphinxext-rediraffe = "*"
sphinx-sitemap = "*"
watermark = "*"

[tool.pixi.feature.docs.tasks]
docs-build = "sphinx-build -b html -j auto examples/ _build"
docs-serve = { cmd = "python -m http.server --bind 127.0.0.1 --directory _build 8000", depends-on = ["docs-build"] }

[tool.pixi.environments]
docs = { features = ["docs"], solve-group = "default" }
